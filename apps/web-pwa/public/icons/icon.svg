<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#15803d"/>
  <circle cx="256" cy="256" r="180" fill="#22c55e" opacity="0.25"/>
  <!-- Molinillo / Windmill Blades -->
  <g transform="translate(256, 256)">
    <!-- Blade 1 -->
    <path d="M0,0 L0,-140 C50,-140 100,-90 100,-40 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Blade 2 -->
    <path d="M0,0 L140,0 C140,50 90,100 40,100 Z" fill="#bbf7d0" opacity="0.95"/>
    <!-- Blade 3 -->
    <path d="M0,0 L0,140 C-50,140 -100,90 -100,40 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Blade 4 -->
    <path d="M0,0 L-140,0 C-140,-50 -90,-100 -40,-100 Z" fill="#bbf7d0" opacity="0.95"/>
    <!-- Center pin -->
    <circle cx="0" cy="0" r="22" fill="#166534"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>
  </g>
</svg>
